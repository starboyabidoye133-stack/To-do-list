<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To do list</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, gold, #4e085f);
      padding: 10px;
    }
    .todo-app {
      width: 100%;
      max-width: 540px;
      background: #fff;
      margin: 10px auto 20px;
      padding: 40px 30px 70px;
      border-radius: 10px;
    }
    .todo-app h2 {
      color: #002765;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      margin-bottom: 10px;
    }
    .todo-app h2 img {
      width: 30px;
      margin-left: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #edeef0;
      border-radius: 30px;
      padding-left: 20px;
      margin-bottom: 25px;
    }
    input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 14px;
      font-weight: 14px;
    }
    button {
      border: none;
      outline: none;
      padding: 16px 50px;
      background: #4e085f;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 40px;
      transition: active box-shadow background color 1s;
    }
    button:hover {
      
    }
    button:active {
      box-shadow: 1px 1px 1px rgba(0, 0, 0, 2);
      background: rgb(250, 213, 7);
      color: #555;
    }
    ul li {
      list-style-type: none;
      font-size: 17px;
      padding: 12px 8px 12px 50px;
      user-select: none;
      cursor: pointer;
      position: relative;
    }
    ul li::before {
      content:  '';
      position: absolute;
      height: 28px;
      width: 28px;
      border-radius: 50%;
      background-image: url(unchecked.png);
      background-size: cover;
      background-position: center;
      top: 12px;
      left: 8px;
    }
   ul li.checked {
    color: #4e085f;
    text-decoration: line-through;
   }
   ul li.checked::before {
    background-image: url(images.jpeg);
   }
   ul li span {
    position: absolute;
    right: 0;
    top: 5px;
    width: 40px;
    height: 40px;
    font-size: 22px;
    color: #555;
    line-height: 40px;
    text-align: center;
    border-radius: 50%;
   }
   ul li span:hover {
    background: #edeef0;
   }

  </style>
</head>
<body>
    <div class="container">
      <div class="todo-app">
        <h2>To-Do-List<img src="icon.png"></h2>
        <div class="row">
          <input type="text" id="input-box" placeholder="Add your task">
          <button onclick="addTask()">ADD</button>
        </div>
        <ul id="list-container">
          <!-- <li class="checked">Task1</li>
          <li>Task1</li>
          <li>Task1</li> --> 
        </ul>
      </div>
  </div>


  <script>
    const inputBox = document.getElementById('input-box');
    const listContainer = document.getElementById('list-container');

    function addTask() {
      if(inputBox.value === ''){
        alert('You must write something!');
      } else{
        let li = document.createElement('li');
        li.innerHTML = inputBox.value;
        listContainer.appendChild(li);
        let span = document.createElement('span')
        span.innerHTML = '\u00d7'
        li.appendChild(span);
      }
      inputBox.value = '';
      saveData()
    }

    listContainer.addEventListener('click', e => {
      if(e.target.tagName === 'LI') {
        e.target.classList.toggle('checked');
        saveData();
      } else if(e.target.tagName === 'SPAN') {
        e.target.parentElement.remove();
        saveData();
      }
    }, false);

    function saveData() {
      localStorage.setItem('data', listContainer.innerHTML);
    }
    function showtask() {
      listContainer.innerHTML = localStorage.getItem('data');
    }
    showtask();
  </script>
  
</body>
</html>
